[project]
name = "apexmind"
version = "0.1.0"
description = "Autonomous agentic racing intelligence platform"
requires-python = ">=3.11"
dependencies = [
    "pysdl2>=0.9.16",
    "pysdl2-dll>=2.28.5",
    "vgamepad>=0.1.0",
    "hidapi>=0.14.0",
    "gymnasium>=1.0.0",
    "stable-baselines3>=2.3.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "anthropic>=0.34.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
]

[tool.ruff]
line-length = 100

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["telemetry", "control", "sim_env", "policy", "agents", "knowledge"]
